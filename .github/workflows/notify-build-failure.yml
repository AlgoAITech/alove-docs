name: Notify build failure

on:
  workflow_run:
    workflows:
      - Markdown link check
      - Notify scaffold repo
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name != 'Notify build failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: AlgoAITech/meta-repo/.github/actions/notify-ci-failure@master
        with:
          webhook-url: ${{ secrets.CI_FAILURE_WEBHOOK_URL }}
          webhook-token: ${{ secrets.CI_FAILURE_WEBHOOK_TOKEN }}
          repository: ${{ github.event.workflow_run.repository.full_name }}
          commit-sha: ${{ github.event.workflow_run.head_sha }}
          branch: ${{ github.event.workflow_run.head_branch }}
          workflow-name: ${{ github.event.workflow_run.name }}
          run-id: ${{ github.event.workflow_run.id }}
          server-url: ${{ github.server_url }}
          error-summary: ${{ github.event.workflow_run.name }} failed on ${{ github.event.workflow_run.head_branch }}
