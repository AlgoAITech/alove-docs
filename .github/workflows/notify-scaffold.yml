name: Notify scaffold repo

on:
  push:
    branches:
      - "**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scaffold update
        env:
          SCAFFOLD_REPO: ${{ vars.SCAFFOLD_REPO }}
        run: |
          set -euo pipefail
          target_repo="${SCAFFOLD_REPO:-AlgoAITech/meta-repo}"
          curl -L -X POST \
            -H "Authorization: token ${{ secrets.SCAFFOLD_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${target_repo}/dispatches" \
            -d "{\"event_type\":\"submodule-updated\",\"client_payload\":{\"repo\":\"alove-docs\",\"source_repo\":\"${{ github.repository }}\",\"source_sha\":\"${{ github.sha }}\"}}"
  notify-build-failure:
    needs: [notify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: ./.github/actions/notify-ci-failure
        with:
          webhook-url: ${{ secrets.CI_FAILURE_WEBHOOK_URL }}
          webhook-token: ${{ secrets.CI_FAILURE_WEBHOOK_TOKEN }}
          repository: ${{ github.repository }}
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          workflow-name: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          server-url: ${{ github.server_url }}
          error-summary: ${{ github.workflow }} failed on ${{ github.head_ref || github.ref_name }}

