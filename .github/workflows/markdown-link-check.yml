name: Markdown link check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          config-file: mlc_config.json
  notify-build-failure:
    needs: [markdown-link-check]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/notify-ci-failure
        with:
          webhook-url: ${{ secrets.CI_FAILURE_WEBHOOK_URL }}
          webhook-token: ${{ secrets.CI_FAILURE_WEBHOOK_TOKEN }}
          repository: ${{ github.repository }}
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          workflow-name: ${{ github.workflow }}
          run-id: ${{ github.run_id }}
          server-url: ${{ github.server_url }}
          error-summary: ${{ github.workflow }} failed on ${{ github.head_ref || github.ref_name }}

